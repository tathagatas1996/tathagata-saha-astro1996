<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>beyond@tsaha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
  .bottom-three {
     margin-bottom: 1.5cm;
    }
    .page .container {
      margin-left: max(6rem, 9vw);
      margin-right: auto;
      max-width: 95%;
    }
    .beyond-hero {
      padding: calc(var(--nav-h) + 4rem) 0 3rem;
      border-bottom: var(--rule);
    }
    .photo-slot img {
      width: 100%; height: 100%;
      object-fit: cover; border-radius: 2px;
    }
    .art-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
    }
    .art-slot {
      aspect-ratio: 3/4;
      background: var(--accent-light);
      border: 1px dashed var(--border);
      border-radius: 2px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 0.5rem; color: var(--text-light);
      font-size: 0.7rem; font-family: var(--mono); text-align: center; padding: 1rem;
    }

    /* ── LIGHTBOX ── */
    .photo-grid img, .art-grid img {
      cursor: zoom-in;
      transition: opacity 0.2s;
    }
    .photo-grid img:hover, .art-grid img:hover { opacity: 0.88; }

    /* ── WATERMARK ── */
    .photo-wrap-wm {
      position: relative;
      display: inline-block;
      line-height: 0;
    }
    .photo-wrap-wm::after {
      content: '© T. Saha';
      position: absolute;
      bottom: 10px; right: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.06em;
      color: rgba(255,255,255,0.85);
      background: rgba(10,15,25,0.45);
      padding: 0.2rem 0.5rem;
      border-radius: 2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .photo-wrap-wm:hover::after { opacity: 1; }
    .photo-wrap-wm img {
      display: block;
      -webkit-user-drag: none;
      user-select: none;
    }

    #lightbox {
      display: none;
      position: fixed; inset: 0;
      background: rgba(10, 15, 25, 0.92);
      z-index: 1000;
      align-items: center; justify-content: center;
      backdrop-filter: blur(6px);
      cursor: zoom-out;
    }
    #lightbox.active { display: flex; }
    #lightbox img {
      max-width: 90vw; max-height: 88vh;
      object-fit: contain;
      border-radius: 2px;
      box-shadow: 0 8px 48px rgba(0,0,0,0.6);
      cursor: default;
    }
    #lightbox-close {
      position: fixed; top: 1.5rem; right: 2rem;
      font-size: 1.8rem; color: #f7f4ef;
      cursor: pointer; opacity: 0.7;
      font-family: var(--sans); line-height: 1;
      transition: opacity 0.2s;
      background: none; border: none;
    }
    #lightbox-close:hover { opacity: 1; }
    .lb-arrow {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      background: rgba(10,15,25,0.5);
      border: 1px solid rgba(255,255,255,0.15);
      color: #f7f4ef;
      font-size: 1.4rem; line-height: 1;
      width: 48px; height: 48px;
      border-radius: 2px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; opacity: 0.7;
      transition: opacity 0.2s;
      z-index: 1001;
    }
    .lb-arrow:hover { opacity: 1; background: rgba(184,149,106,0.5); }
    .lb-arrow:disabled { opacity: 0.2; cursor: default; }
    #lb-prev { left: 1.5rem; }
    #lb-next { right: 1.5rem; }
    #lb-counter {
      position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%);
      font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
      letter-spacing: 0.1em; color: rgba(247,244,239,0.5);
    }
  </style>
</head>

<body>
<nav>
    <a href="index.html" class="nav-logo", style="font-family: Calibri; font-size: 1.2rem; color: darkslategray; text-decoration: none; letter-spacing: 0.06em; display: inline-block; margin-bottom: 0.5rem;"> Tathagata Saha, Ph.D.</a>
    <ul class="nav-links">
      <li><a href="beyond.html" class="active">Back to beyond</a></li>
    </ul>
  </nav>
    <!-- TEMPLES -->
    <section class="section">
      <div class="container">
        <h2 style="color: darkslategray; font-size: 1.8rem; font-family: Calibri; margin-bottom: 0.8rem; margin-bottom: 0.2rem;">Caves and/or temples</h2>
        <div class="photo-theme" style="margin-top: 2.5rem;">
        <h3 class="photo-theme-title" style="color: black; font-family: Calibri; font-size: 1.2rem; margin-bottom: 0.8rem;"><b>The abode of mythological Gods and demons</b></h3>
        <span class="photo-theme-sub" style="color: black; font-family: Calibri; font-size: 1.1rem; margin-bottom: 0.8rem;">Ajanta, Ellora</span>
          

          <div class="photo-grid">
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ajanta1.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ajanta2.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ellora1.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ellora2.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
          </div>
          <p class="bottom-three"> </p>
          <div class="photo-grid">
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ellora3.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
            <div class="photo-wrap-wm"><img src="photos/cave_temples/ellora4.jpg" alt="Tathagata Saha" style="width:260px;height:360px;object-fit:cover;border-radius:2px;border:1px solid rgba(255,255,255,0.1);" /></div>
          </div>
        </div>
      </div>
    </section>
    
 <!-- ── LIGHTBOX ── -->
  <div id="lightbox">
    <button id="lightbox-close" aria-label="Close">&#x2715;</button>
    <button class="lb-arrow" id="lb-prev" aria-label="Previous">&#8592;</button>
    <img id="lightbox-img" src="" alt="" />
    <button class="lb-arrow" id="lb-next" aria-label="Next">&#8594;</button>
    <span id="lb-counter"></span>
  </div>

  <script>
    const lightbox  = document.getElementById('lightbox');
    const lbImg     = document.getElementById('lightbox-img');
    const lbClose   = document.getElementById('lightbox-close');
    const lbPrev    = document.getElementById('lb-prev');
    const lbNext    = document.getElementById('lb-next');
    const lbCounter = document.getElementById('lb-counter');

    let currentSet   = [];
    let currentIndex = 0;

    document.querySelectorAll('img').forEach(img => {
      img.addEventListener('contextmenu', e => e.preventDefault());
    });

    // group by photo-theme: clicking opens all imgs within that theme
    document.querySelectorAll('.photo-theme').forEach(theme => {
      const imgs = Array.from(theme.querySelectorAll('.photo-grid img'));
      imgs.forEach((img, i) => {
        img.addEventListener('click', () => openLightbox(imgs, i));
      });
    });

    document.querySelectorAll('.art-grid img').forEach((img, i, arr) => {
      img.addEventListener('click', () => openLightbox(Array.from(arr), i));
    });

    function openLightbox(set, index) {
      currentSet   = set;
      currentIndex = index;
      showImage();
      lightbox.classList.add('active');
      document.body.style.overflow = 'hidden';
    }

    function showImage() {
      lbImg.src = currentSet[currentIndex].src;
      lbImg.alt = currentSet[currentIndex].alt;
      lbCounter.textContent = `${currentIndex + 1} / ${currentSet.length}`;
      lbPrev.disabled = currentIndex === 0;
      lbNext.disabled = currentIndex === currentSet.length - 1;
    }

    lbPrev.addEventListener('click', e => {
      e.stopPropagation();
      if (currentIndex > 0) { currentIndex--; showImage(); }
    });

    lbNext.addEventListener('click', e => {
      e.stopPropagation();
      if (currentIndex < currentSet.length - 1) { currentIndex++; showImage(); }
    });

    lbImg.addEventListener('contextmenu', e => e.preventDefault());

    function closeLightbox() {
      lightbox.classList.remove('active');
      document.body.style.overflow = '';
      lbImg.src = '';
    }

    lbClose.addEventListener('click', closeLightbox);
    lightbox.addEventListener('click', e => {
      if (e.target !== lbImg && e.target !== lbPrev && e.target !== lbNext) closeLightbox();
    });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape')     closeLightbox();
      if (e.key === 'ArrowLeft')  { if (currentIndex > 0) { currentIndex--; showImage(); } }
      if (e.key === 'ArrowRight') { if (currentIndex < currentSet.length - 1) { currentIndex++; showImage(); } }
    });
  </script>
    
</body>
